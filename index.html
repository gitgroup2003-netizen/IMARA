<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imara</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B5F58'/%3E%3Crect x='13' y='7' width='6' height='18' rx='2' fill='white'/%3E%3Ccircle cx='24' cy='8' r='3' fill='%23E8A93B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F4;--card:#FFFFFF;--ink:#10242E;--mute:#5B6E76;--line:#DCE4E3;--brand:#0B5F58;--brand-ink:#FFFFFF;--sun:#E8A93B;--bad:#B3261E;--ok:#16794C}
@media (prefers-color-scheme:dark){:root{--bg:#0C1A20;--card:#132630;--ink:#E7F0EF;--mute:#93A8AE;--line:#22404B;--brand:#2FB5A6;--brand-ink:#06201D;--bad:#FF8A80;--ok:#5FD3A0}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
.wrap{max-width:460px;margin:0 auto;padding:16px 16px 40px}
h2,.num{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;margin:0}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font:700 26px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.test{background:var(--sun);color:#2B1D00;font-size:13px;padding:6px 12px;border-radius:8px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.hero{background:var(--brand);color:var(--brand-ink);border:0;position:relative;overflow:hidden}
.hero small{opacity:.8}
.hero .num{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.hero .sub{opacity:.85;margin-top:2px}
.hero .bar{position:absolute;right:22px;top:0;width:10px;height:100%;background:rgba(255,255,255,.14)}
.hero .bar::after{content:"";position:absolute;top:18px;left:-1px;width:12px;height:12px;border-radius:50%;background:var(--sun)}
.hi{font-weight:600;margin:0 0 12px}
.sub{color:var(--mute)}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
input:focus,button:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
button{font:600 16px "DM Sans",sans-serif;border:0;border-radius:10px;padding:13px 16px;cursor:pointer;background:var(--brand);color:var(--brand-ink);width:100%;margin-top:16px}
button.ghost{background:transparent;color:inherit;border:1px solid currentColor;width:auto;margin:14px 0 0;padding:8px 12px;font-size:14px;opacity:.9}
header button.ghost{margin:0;color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.55;cursor:default}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{margin:0;background:transparent;color:var(--mute);border:1px solid var(--line)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{width:auto;margin:0;padding:9px 14px;font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.chips button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.quote{margin-top:14px;padding:12px;border-radius:10px;background:var(--bg);border-left:4px solid var(--sun);font-size:15px}
.quote b{font-family:"Bricolage Grotesque",sans-serif;font-size:22px}
.msg{margin-top:12px;font-size:14px}.err{color:var(--bad)}.good{color:var(--ok)}
.rc{text-align:center}
.rc .tick{width:56px;height:56px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:4px auto 10px}
.rc .num{font-size:34px}
.rows{margin:18px 0 4px;text-align:left}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}.row span:first-child{color:var(--mute)}
.tx{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}.tx small{color:var(--mute);display:block}
.pos{color:var(--ok)}
.link{background:none;border:0;color:var(--brand);padding:0;margin:14px 0 0;width:auto;text-decoration:underline}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--brand)"/><rect x="13" y="7" width="6" height="18" rx="2" fill="var(--brand-ink)"/><circle cx="24" cy="8" r="3" fill="#E8A93B"/></svg>
      imara
    </div>
    <button id="out" class="ghost" hidden>Sign out</button>
  </header>
  <div class="test">Test mode. All money here is fake.</div>

  <section id="auth" class="card" hidden>
    <h2 id="authTitle">Welcome back</h2>
    <p class="sub">Keep your money steady in dollars. Pay in shillings.</p>
    <label for="email">Email</label><input id="email" type="email" autocomplete="email">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" minlength="8">
    <button id="authBtn">Sign in</button>
    <button id="toggle" class="link" type="button">New here? Create an account</button>
    <div id="authMsg" class="msg" role="status"></div>
  </section>

  <main id="app" hidden>
    <p class="hi" id="hi"></p>
    <div class="card hero">
      <div class="bar"></div>
      <small>Your balance</small>
      <div class="num" id="bal">$0.00</div>
      <div class="sub" id="balUgx"></div>
      <button id="dep" class="ghost">Add $10 test dollars</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tPay" aria-selected="true">Pay</button>
      <button role="tab" id="tAct" aria-selected="false">Activity</button>
    </div>

    <section id="pay" class="card">
      <div id="form">
        <div class="chips" id="chips" role="group" aria-label="Service"></div>
        <label for="rcp" id="rcpL">Phone number</label><input id="rcp" inputmode="tel" placeholder="0771234567">
        <label for="amt">Amount in UGX</label><input id="amt" inputmode="numeric" placeholder="10000">
        <div class="quote" id="quote" hidden></div>
        <button id="payBtn">Pay now</button>
        <div id="payMsg" class="msg err" role="status"></div>
      </div>
      <div id="receipt" class="rc" hidden>
        <div class="tick"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h2>Payment sent</h2>
        <div class="num" id="rcAmt"></div>
        <div class="rows" id="rcRows"></div>
        <button id="done">Done</button>
      </div>
    </section>

    <section id="act" class="card" hidden><div id="list"></div></section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://vgbqgvabpytyghwoqyxg.supabase.co";
const SUPABASE_KEY = "sb_publishable_soAJXA9ucr_gAtpDrbwqBQ_hY4G44g3"; // safe to expose; never put the secret key here
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const SERVICES = [["MTN airtime","Phone number"],["Airtel airtime","Phone number"],["UMEME electricity","Meter number"],["NWSC water","Water account number"],["Send to mobile money","Phone number"]];
let signup = false, rate = 3700, feeRate = 0.01, svc = SERVICES[0][0];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = n => "$" + Number(n).toFixed(2);
const ugx = n => "UGX " + Math.round(n).toLocaleString("en-US");

$("toggle").onclick = () => {
  signup = !signup;
  $("authTitle").textContent = signup ? "Create your account" : "Welcome back";
  $("authBtn").textContent = signup ? "Create account" : "Sign in";
  $("toggle").textContent = signup ? "Already have an account? Sign in" : "New here? Create an account";
  $("authMsg").textContent = "";
};
$("authBtn").onclick = async () => {
  const email = $("email").value.trim(), password = $("pw").value, m = $("authMsg");
  m.className = "msg"; m.textContent = "Please wait…";
  const { data, error } = signup ? await db.auth.signUp({ email, password }) : await db.auth.signInWithPassword({ email, password });
  if (error) { m.className = "msg err"; m.textContent = error.message; return; }
  if (signup && !data.session) { m.className = "msg good"; m.textContent = "Check your email to confirm your account, then sign in."; return; }
  m.textContent = "";
};
$("out").onclick = () => db.auth.signOut();

function show(tab) {
  const pay = tab === "pay";
  $("pay").hidden = !pay; $("act").hidden = pay;
  $("tPay").setAttribute("aria-selected", pay); $("tAct").setAttribute("aria-selected", !pay);
  if (!pay) loadActivity();
}
$("tPay").onclick = () => show("pay"); $("tAct").onclick = () => show("act");

function drawChips() {
  $("chips").innerHTML = SERVICES.map(([n]) => `<button type="button" aria-pressed="${n === svc}" data-s="${esc(n)}">${esc(n)}</button>`).join("");
  $("rcpL").textContent = SERVICES.find(s => s[0] === svc)[1];
  $("rcp").placeholder = /UMEME|NWSC/.test(svc) ? "Number on your bill" : "0771234567";
}
$("chips").onclick = e => { const b = e.target.closest("button"); if (b) { svc = b.dataset.s; drawChips(); } };

function renderQuote() {
  const a = Number($("amt").value), q = $("quote");
  if (!a || a < 1000) { q.hidden = true; return; }
  const base = Math.round(a / rate * 100) / 100, fee = Math.round(base * feeRate * 100) / 100;
  q.hidden = false;
  q.innerHTML = `You pay <b>${usd(base + fee)}</b><br><small>Rate: ${Math.round(rate).toLocaleString("en-US")} UGX per $1. Fee: ${usd(fee)}</small>`;
}
$("amt").oninput = renderQuote;

async function loadWallet() {
  const [{ data: w }, { data: s }] = await Promise.all([
    db.from("wallets").select("balance_usd").maybeSingle(),
    db.from("settings").select("key,value")
  ]);
  (s || []).forEach(r => { if (r.key === "ugx_per_usd") rate = Number(r.value); if (r.key === "fee_rate") feeRate = Number(r.value); });
  const b = Number(w?.balance_usd || 0);
  $("bal").textContent = usd(b);
  $("balUgx").textContent = "About " + ugx(b * rate);
  renderQuote();
}
async function loadActivity() {
  const { data, error } = await db.from("transactions").select("*").order("created_at", { ascending: false }).limit(30);
  const l = $("list");
  if (error) { l.innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
  if (!data.length) { l.innerHTML = `<p class="sub">Nothing yet. Add test dollars, then make a payment.</p>`; return; }
  l.innerHTML = data.map(t => {
    const dep = t.kind === "deposit";
    return `<div class="tx"><div>${esc(t.service)}<small>${esc(t.recipient || "")} ${new Date(t.created_at).toLocaleString()}</small></div>
      <div style="text-align:right" class="${dep ? "pos" : ""}">${dep ? "+" : "−"}${usd(t.amount_usd)}${dep ? "" : `<small>${ugx(t.amount_ugx)}</small>`}</div></div>`;
  }).join("");
}

$("dep").onclick = async () => {
  $("dep").disabled = true;
  const { error } = await db.rpc("test_deposit", { p_amount: 10 });
  $("dep").disabled = false;
  if (error) alert(error.message); else loadWallet();
};
$("payBtn").onclick = async () => {
  const m = $("payMsg"), btn = $("payBtn"), to = $("rcp").value.trim(); m.textContent = "";
  btn.disabled = true;
  const { data, error } = await db.rpc("pay_service", { p_service: svc, p_recipient: to, p_amount_ugx: Number($("amt").value) });
  btn.disabled = false;
  if (error) { m.textContent = error.message; return; }
  $("rcAmt").textContent = ugx(data.amount_ugx);
  const row = (a, b) => `<div class="row"><span>${a}</span><span>${b}</span></div>`;
  $("rcRows").innerHTML = row("Service", esc(svc)) + row("To", esc(to)) + row("You spent", usd(data.total_usd)) +
    row("Fee included", usd(data.fee_usd)) + row("Rate", Math.round(data.rate).toLocaleString("en-US") + " UGX per $1") +
    row("Time", new Date().toLocaleString());
  $("form").hidden = true; $("receipt").hidden = false;
  loadWallet();
};
$("done").onclick = () => { $("amt").value = ""; $("quote").hidden = true; $("receipt").hidden = true; $("form").hidden = false; };

async function route(session) {
  $("auth").hidden = !!session; $("app").hidden = !session; $("out").hidden = !session;
  if (session) {
    const n = (session.user.email || "").split("@")[0];
    $("hi").textContent = "Hello, " + n;
    drawChips(); loadWallet(); show("pay");
  }
}
db.auth.getSession().then(({ data }) => route(data.session));
db.auth.onAuthStateChange((_e, session) => route(session));
</script>
</body>
</html>
